<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marca · Campaña · Banners</title>
<!--
  Plantilla de maquetación por piezas.
  - Cada pieza es un div.ad con data-name = nombre del archivo exportado (marca-campaña-modelo-medida).
  - Todo va en posición absoluta, en píxeles de la pieza: fácil de corregir por rondas.
  - Exporta con: node scripts/export_pieces.mjs src/banners.html export/display 1,2
  - Cambia las fuentes por las extraídas del editable (src/assets/).
-->
<style>
  @font-face { font-family: Titular; src: url(assets/Titular.ttf); font-weight: 700; }
  @font-face { font-family: Texto;   src: url(assets/Texto.ttf);   font-weight: 400; }
  :root { --brand: #ec1c24; --ink: #000; --paper: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e9e9; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }

  .ad { position: relative; overflow: hidden; background: var(--brand); color: var(--paper); flex: none; }
  .ad > * { position: absolute; }
  .ad img { display: block; max-width: none; }

  /* Mide el interlineado en el editable (distancia entre líneas base / tamaño) y cópialo aquí. */
  .hl    { font-family: Titular; font-weight: 700; line-height: .92; white-space: nowrap; }
  .price { font-family: Titular; font-weight: 700; line-height: 1; white-space: nowrap; }
  .lbl   { font-family: Texto; line-height: 1; white-space: nowrap; }
  .bens  { font-family: Texto; line-height: 1.3; }
  .legal { font-family: Texto; line-height: 1.3; opacity: .9; }
  .cta   { background: var(--ink); color: var(--paper); font-family: Titular; font-weight: 700;
           display: flex; align-items: center; justify-content: center; letter-spacing: .06em; white-space: nowrap; }
  /* Para que una frase no se parta: une sus palabras con &nbsp; (ej. FINANCIA&nbsp;HASTA&nbsp;EL&nbsp;90%) */
</style>
</head>
<body>

<!-- ===== DISPLAY · 300x250 ===== -->
<div class="ad" data-name="marca-campana-modelo-300x250" style="width:300px;height:250px">
  <img src="assets/logo-marca.svg" style="left:14px;top:14px;width:70px">
  <img src="assets/producto.png" style="left:10px;top:50px;width:180px">
  <div class="hl" style="left:192px;top:50px;font-size:30px">TITULAR<br>EN DOS</div>
  <div class="lbl" style="left:14px;top:178px;font-size:10px">PRECIO ESPECIAL</div>
  <div class="price" style="left:13px;top:192px;font-size:19px">US$00,000</div>
  <div class="cta" style="right:14px;top:180px;width:76px;height:34px;font-size:14px">COTIZAR</div>
  <div class="legal" style="left:14px;top:224px;width:272px;font-size:6px">*Texto legal literal del editable.</div>
</div>

<!-- Duplica el bloque para cada medida: 970x250, 970x90, 728x90, 300x600, 160x600, 320x50, 550x480… -->

</body>
</html>
